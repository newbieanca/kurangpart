<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#202124">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SHORTAGES">
<title>SHORTAGES</title>
<style>
:root{--red:#E60012;--ink:#202124;--ink2:#3C4043;--mute:#5F6368;--bg:#F4F5F7;--line:#DADCE0;--yel:#F5B400;--grn:#188038}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:12px;padding-bottom:40px}
.hero{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;margin-bottom:12px;background:#fff;border:1px solid var(--line);border-bottom:4px solid var(--red)}
.hero .app{width:52px;height:52px;border-radius:12px;flex:none}.hero .wm{height:48px;width:auto;max-width:calc(100% - 70px);object-fit:contain}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lblrow{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px}.lblrow label{margin:0 0 4px}
.lnk{background:none;border:0;color:var(--red);font:inherit;font-size:13px;font-weight:800;padding:4px 0;cursor:pointer}
h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:800}
h2::before{content:"";width:5px;height:18px;border-radius:2px;background:var(--red)}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:9px;background:#fff;color:inherit}
input:focus,select:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 3px rgba(230,0,18,.18)}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.btn{display:block;width:100%;border:0;border-radius:9px;padding:14px;font:inherit;font-weight:800;cursor:pointer;color:#fff;background:var(--red);letter-spacing:.2px}
.btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.6}
.msg{font-size:13.5px;margin-top:8px;min-height:18px}.err{color:#C5221F;font-weight:600}.ok{color:var(--grn);font-weight:700}
#sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 12px}
.tile{border-radius:10px;padding:8px 4px;text-align:center;color:#fff;background:var(--ink)}
.tile b{display:block;font-size:22px;font-weight:800;line-height:1.1}.tile small{font-size:11.5px;font-weight:700;opacity:.95}
.tile.r{background:var(--red)}.tile.y{background:var(--yel);color:#2a1d00}.tile.g{background:var(--grn)}
.card{border-radius:12px;padding:12px 12px 12px 14px;margin-bottom:10px;border:1px solid var(--line);border-left:7px solid #999;background:#fff}
.card.Belum{border-left-color:var(--red)}.card.Partial{border-left-color:var(--yel)}.card.Complete{border-left-color:var(--grn)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-size:12px;font-weight:800;padding:4px 10px;border-radius:6px;color:#fff;white-space:nowrap;letter-spacing:.3px}
.LINEA{background:#1A56DB}.LINEB{background:#7E3AF2}
.sBelum{background:var(--red)}.sPartial{background:var(--yel);color:#2a1d00}.sComplete{background:var(--grn)}
.meta{font-size:12.5px;color:var(--mute)}
.model{font-weight:800;font-size:18px;margin:6px 0 0;color:var(--ink)}
.part{font-weight:700;font-size:15px;color:var(--ink2);margin:1px 0 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.stats div{background:var(--bg);border-radius:8px;padding:7px 4px;text-align:center}
.stats small{display:block;font-size:11px;font-weight:700;color:var(--mute)}.stats b{font-size:20px;font-weight:800}
.Belum .sisa{background:#FDE7E9;color:#B00010}.Partial .sisa{background:#FFF3CD;color:#7A5200}.Complete .sisa{background:#E6F4EA;color:#0D652D}
.cmc{font-size:12.5px;color:var(--ink2);margin-top:8px;padding:7px 10px;border-radius:8px;background:var(--bg);border-left:3px solid var(--ink2)}
.card .btn{margin-top:10px;padding:11px;font-size:14px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.tools .btn{font-size:13.5px;padding:12px 6px}
#addBg{position:fixed;inset:0;background:rgba(32,33,36,.6);display:none;align-items:flex-end;justify-content:center;z-index:11}#addBg.on{display:flex}
#sheetBg{position:fixed;inset:0;background:rgba(32,33,36,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
#sheetBg.on{display:flex}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));border-top:5px solid var(--red);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.mon .btn{padding:10px 0;font-size:14px;flex:0 0 46px}.mon #mAll{flex:0 0 72px}.mon input{flex:1}
.foot{text-align:center;color:#B8BCC2;font-size:12px;letter-spacing:.6px;margin-top:18px}
.empty{text-align:center;color:var(--mute);padding:24px 8px;background:#fff;border:1px solid var(--line);border-radius:12px}
</style>
</head>

async function post(body){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  const j=await r.json(); if(!j.ok) throw new Error(j.error||'Gagal'); return j;
}

async function load(){
  const st=$('state'),ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),25000);
  st.className='msg';st.textContent='Memuat data...';
  const id=(API.split('/s/')[1]||'').slice(0,8);
  try{
    const r=await fetch(API+'?t='+Date.now(),{signal:ctl.signal});
    const txt=await r.text();let j;
    try{j=JSON.parse(txt)}catch(_){throw new Error('Respons bukan JSON (HTTP '+r.status+'). Biasanya akses deployment belum "Anyone" atau URL bukan /exec yang benar.')}
    if(!j||j.ok!==true) throw new Error(j&&j.error?j.error:'Format respons tidak sesuai. Deployment kemungkinan masih memakai kode lama. Respons: '+txt.slice(0,120));
    D=j.data||[];
    const mv0=$('model').value,mv=mv0==='__new__'?'':mv0,M=j.models||[],P=j.parts||[];MODELS=M;PARTS=P;
    $('model').innerHTML='<option value="">'+(M.length?'Pilih model':'Tab MODEL kosong')+'</option>'+M.map(m=>`<option>${esc(m)}</option>`).join('')+'<option value="__new__">+ Tambah model baru...</option>';
    if(mv) $('model').value=mv;
    $('partList').innerHTML=P.map(p=>`<option value="${esc(p)}">`).join('');
    st.className='msg ok';st.textContent=`Terhubung: ${D.length} laporan, ${M.length} model, ${P.length} part`;
    render();
  }catch(e){
    let m=e.message;
    if(e.name==='AbortError')m='Waktu habis (25 detik). Cek sinyal.';
    else if(m==='Failed to fetch'||m==='Load failed')m='Tidak bisa terhubung ke Apps Script. Cek URL /exec dan akses "Anyone". Buka aplikasi di Chrome/Safari, bukan pratinjau chat.';
    st.className='msg err';st.textContent='Gagal memuat ('+id+'...): '+m;
    if($('model').options.length<=1)$('model').innerHTML='<option value="">Gagal memuat model, lihat pesan di Riwayat</option>';
  }finally{clearTimeout(t)}
}

function filtered(){
  const l=$('fLine').value,s=$('fSt').value,mo=$('fMon').value,q=$('fQ').value.trim().toLowerCase();
  return D.filter(d=>{
    if(l&&d.line!==l)return false;
    if(s&&d.statusCMC!==s)return false;
    if(mo&&(d.tanggal.slice(6,10)+'-'+d.tanggal.slice(3,5))!==mo)return false;
    if(q&&!(d.model+' '+d.part+' '+d.nama).toLowerCase().includes(q))return false;
    return true;
  });
}

function render(){
  const L=filtered(),c={Belum:0,Partial:0,Complete:0};
  L.forEach(d=>{if(c[d.statusCMC]!=null)c[d.statusCMC]++});
  $('sum').innerHTML=`<div class="tile"><b>${L.length}</b><small>Total</small></div><div class="tile r"><b>${c.Belum}</b><small>🔴 Belum</small></div><div class="tile y"><b>${c.Partial}</b><small>🟡 Partial</small></div><div class="tile g"><b>${c.Complete}</b><small>🟢 Complete</small></div>`;
  $('list').innerHTML=L.length?L.map(d=>`
  <div class="card ${esc(d.statusCMC)}">
    <div class="top"><span class="badge ${d.line==='LINE B'?'LINEB':'LINEA'}">${esc(d.line)}</span><span class="badge s${esc(d.statusCMC)}">${esc(d.statusCMC)}</span></div>
    <div class="meta" style="margin-top:6px">${esc(d.tanggal)} • ${esc(d.nama)}</div>
    <div class="model">${esc(d.model)}</div>
    <div class="part">${esc(d.part)}</div><div class="stats"><div><small>Kurang</small><b>${d.kurang}</b></div><div><small>Datang</small><b>${d.datang}</b></div><div class="sisa"><small>Sisa</small><b>${d.sisa}</b></div></div>
    <div class="meta">${esc(d.statusAwal)}${d.remarks?' • '+esc(d.remarks):''}</div>
    ${d.updateCMC?`<div class="cmc">CMC: ${esc(d.updateCMC)}${d.terakhir?' ('+esc(d.terakhir)+')':''}</div>`:''}
    <button class="btn sec" data-id="${esc(d.id)}">✏️ UPDATE CMC</button>
  </div>`).join(''):'<div class="empty">Belum ada laporan untuk filter ini.</div>';
}

// Kirim laporan
$('send').onclick=async()=>{
  const m=$('fmsg');m.className='msg';
  const b={action:'add',nama:$('nama').value.trim(),tanggal:$('tgl').value,line:$('line').value,model:$('model').value,part:$('part').value.trim(),kurang:Number($('kurang').value),statusAwal:$('sa').value,remarks:$('rem').value.trim()};
  if(!b.nama)return m.className='msg err',m.textContent='Nama wajib diisi.';
  if(!b.model||b.model==='__new__')return m.className='msg err',m.textContent='Pilih model.';
  if(!b.part)return m.className='msg err',m.textContent='Isi part.';
  if($('kurang').value===''||!(b.kurang<0))return m.className='msg err',m.textContent='Kekurangan harus angka negatif, cth: -30.';
  const hit=PARTS.find(p=>p.toLowerCase()===b.part.toLowerCase());
  if(hit)b.part=hit;
  else{
    if(!confirm('Part "'+b.part+'" belum terdaftar. Tambahkan ke daftar Part dan kirim laporan?'))return;
    try{const r=await post({action:'addPart',name:b.part});b.part=r.name}catch(e){m.className='msg err';m.textContent='Gagal menambah part: '+e.message;return}
  }
  $('send').disabled=true;m.textContent='Mengirim...';
  try{
    await post(b);
    m.className='msg ok';m.textContent='Terkirim';
    ['part','kurang','rem'].forEach(i=>$(i).value='');
    try{localStorage.setItem('pp_nama',b.nama)}catch(e){}
    await load();
  }catch(e){m.className='msg err';m.textContent='Gagal kirim: '+e.message}
  $('send').disabled=false;
};

// Update CMC
$('list').onclick=e=>{
  const id=e.target.closest('button[data-id]');if(!id)return;
  cur=D.find(d=>d.id===id.dataset.id);if(!cur)return;
  $('sInfo').textContent=`${cur.model} - ${cur.part} | Sisa ${cur.sisa}`;
  $('sQty').value='';$('sKet').value='';$('smsg').textContent='';
  $('sheetBg').classList.add('on');setTimeout(()=>$('sQty').focus(),150);
};
const closeSheet=()=>{$('sheetBg').classList.remove('on');cur=null};
$('sCancel').onclick=closeSheet;
$('sheetBg').onclick=e=>{if(e.target===$('sheetBg'))closeSheet()};
$('sSave').onclick=async()=>{
  const m=$('smsg'),q=Number($('sQty').value);m.className='msg';
  if(!(q>0))return m.className='msg err',m.textContent='Qty harus lebih dari 0.';
  $('sSave').disabled=true;m.textContent='Menyimpan...';
  try{
    await post({action:'update',id:cur.id,datang:q,updateCMC:$('sKet').value.trim()});
    closeSheet();await load();
  }catch(e){m.className='msg err';m.textContent='Gagal simpan: '+e.message}
  $('sSave').disabled=false;
};

// Export
$('bWa').onclick=async()=>{
  const L=filtered().slice().reverse(),g={},o=[];
  L.forEach(d=>{const k=d.line+' | '+d.model;(g[k]=g[k]||[]).push(d)});
  const now=new Date().toLocaleDateString('en-GB',{timeZone:'Asia/Jakarta'});
  let t=`*UPDATE PENDING PART - ${now}*\n`;
  Object.keys(g).forEach(k=>{t+=`\n${k}\n`+g[k].map(d=>`    - ${d.part} ${d.sisa} ${d.statusCMC.toUpperCase()}`).join('\n')+'\n'});
  try{await navigator.clipboard.writeText(t);alert('Teks WhatsApp disalin.')}
  catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();alert('Teks WhatsApp disalin.')}
};

$('addModelBtn').onclick=()=>openAdd('model');
$('addPartBtn').onclick=()=>openAdd('part',$('part').value.trim());
$('model').onchange=()=>{if($('model').value==='__new__')openAdd('model')};
$('aCancel').onclick=closeAdd;
$('addBg').onclick=e=>{if(e.target===$('addBg'))closeAdd()};
$('aSave').onclick=async()=>{
  const kind=addKind,m=$('amsg'),name=$('aName').value.replace(/\s+/g,' ').trim();
  if(!name)return m.className='msg err',m.textContent='Nama wajib diisi.';
  $('aSave').disabled=true;m.className='msg';m.textContent='Menyimpan...';
  try{
    const j=await post({action:kind==='model'?'addModel':'addPart',name});
    $('addBg').classList.remove('on');addKind=null;
    await load();
    if(kind==='model')$('model').value=j.name;else $('part').value=j.name;
    const f=$('fmsg');f.className='msg ok';f.textContent=(j.exists?'Sudah ada di daftar: ':'Ditambahkan ke daftar: ')+j.name;
  }catch(e){m.className='msg err';m.textContent='Gagal menyimpan: '+e.message}
  $('aSave').disabled=false;
};
function shiftMon(n){let v=$('fMon').value||todayISO().slice(0,7),[y,m]=v.split('-').map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}$('fMon').value=y+'-'+String(m).padStart(2,'0');render()}
$('mPrev').onclick=()=>shiftMon(-1);$('mNext').onclick=()=>shiftMon(1);$('mAll').onclick=()=>{$('fMon').value='';render()};
['fLine','fSt','fMon'].forEach(i=>$(i).onchange=render);
$('fQ').oninput=render;

$('tgl').value=todayISO();$('fMon').value=todayISO().slice(0,7);
try{$('nama').value=localStorage.getItem('pp_nama')||''}catch(e){}
load();
</script>
</body>
</html>
